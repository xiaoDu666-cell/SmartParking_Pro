<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员登录 - PlateScope</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px); /* 磨砂玻璃效果 */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px; border-radius: 16px; width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #fff; text-align: center;
        }
        .glass-panel h2 { margin-bottom: 25px; font-weight: bold; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { font-size: 14px; margin-bottom: 8px; display: block; color: rgba(255,255,255,0.8); }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.3); color: #fff; outline: none; transition: 0.3s;
        }
        .form-group input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .btn-login {
            width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00ffcc;
            color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-login:hover { background: #00d2a6; box-shadow: 0 0 15px rgba(0,255,204,0.6); }
        .error { color: #ff4444; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h2>门禁管理后台登录</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" name="password" placeholder="请输入密码 (admin123)" required>
            </div>
            <button type="submit" class="btn-login">安全登录</button>
        </form>
    </div>
</body>
</html>
