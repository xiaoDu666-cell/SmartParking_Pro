<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员登录 - PlateScope</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }

        /* 背景设置 */
        body {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            /* 这里使用一张航拍停车场的图片作为背景，你可以替换成本地的图片路径 */
            background: url('https://images.unsplash.com/photo-1506521781263-d8422e82f27a?q=80&w=1920&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
        }

        /* 磨砂玻璃面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.2); /* 稍微调亮一点底色 */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 45px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: #fff;
            text-align: center;
        }

        .glass-panel h2 { margin-bottom: 30px; font-weight: bold; letter-spacing: 2px; font-size: 22px;}

        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { font-size: 14px; margin-bottom: 10px; display: block; color: rgba(255,255,255,0.9); }

        .form-group input {
            width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.3); color: #fff; outline: none; transition: 0.3s; font-size: 16px;
        }
        .form-group input:focus { border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }

        /* 登录按钮 */
        .btn-login {
            width: 100%; padding: 14px; border-radius: 8px; border: none; background: #00ffcc;
            color: #000; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
            margin-bottom: 15px;
        }
        .btn-login:hover { background: #00d2a6; box-shadow: 0 0 15px rgba(0,255,204,0.6); }

        /* 新增：返回大屏按钮 */
        .btn-back {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.4); background: transparent;
            color: #fff; font-size: 14px; cursor: pointer; transition: 0.3s;
            text-decoration: none; display: block; text-align: center;
        }
        .btn-back:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        .error { color: #ff4444; font-size: 14px; margin-bottom: 15px; font-weight: bold; background: rgba(255,0,0,0.1); padding: 8px; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="glass-panel">
        <h2>门禁管理后台登录</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" name="password" placeholder="请输入密码 (admin123)" required>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="btn-login">安全登录</button>

            <!-- 返回大屏按钮 -->
            <a href="/" class="btn-back">⬅ 返回前台监控大屏</a>
        </form>
    </div>
</body>
</html>
